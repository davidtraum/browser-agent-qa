services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: browser-tests
    depends_on:
      - redis
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    shm_size: "2gb"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
