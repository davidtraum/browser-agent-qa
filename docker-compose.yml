services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      QUEUE_NAME: browser-tests
      JOB_TIMEOUT_SECONDS: 300
      SHOPWARE_WORKSPACES_DIR: /tmp/browser-agent-shopware
      SHOPWARE_ADMIN_URL: http://host.docker.internal:5173
      SHOPWARE_DEFAULT_BRANCH: trunk
    depends_on:
      - redis
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/browser-agent-shopware:/tmp/browser-agent-shopware
    init: true
    shm_size: "2gb"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
